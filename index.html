<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AquaCheck — Feed Document Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">

  <div id="view-gate" style="display:none;"></div>

  <div id="app-shell" style="display:none;">
    <div class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" stroke="#0C2D46" stroke-width="2"/>
          <path d="M8 26c4-6 8-6 12 0s8 6 12 0 8-6 8 0" stroke="#2A8C82" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <path d="M8 32c4-6 8-6 12 0s8 6 12 0 8-6 8 0" stroke="#0C2D46" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.55"/>
        </svg>
        <div class="brand-text">
          <h1>AquaCheck</h1>
          <p>Feed Document Inspection</p>
        </div>
      </div>
      <div class="maintabs">
        <div class="maintab" id="tab-document">Document</div>
        <div class="maintab" id="tab-checklist">Checklist Settings</div>
      </div>
    </div>

    <div id="view-document"></div>
    <div id="view-checklist" style="display:none;"></div>
  </div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
