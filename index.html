<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AquaCheck — Feed Document Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --paper: #F6F3EC;
    --paper-dim: #EFEAE0;
    --ink: #16283A;
    --ink-soft: #4A5A6A;
    --navy: #0C2D46;
    --navy-deep: #081D30;
    --teal: #2A8C82;
    --teal-deep: #1F6E66;
    --coral: #C85A3E;
    --amber: #B4831F;
    --success: #3F7D5C;
    --line: #D9D2C0;
    --line-strong: #B9AF97;
    --shadow: 0 1px 2px rgba(12,45,70,0.06), 0 2px 10px rgba(12,45,70,0.06);
    --radius: 7px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(42,140,130,0.06), transparent),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  .masthead{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding-bottom:18px;margin-bottom:22px;border-bottom:2px solid var(--navy);
    gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:42px;height:42px;flex:none;}
  .brand-text h1{
    font-family:'Spectral', serif;font-weight:600;font-size:26px;letter-spacing:0.2px;
    margin:0;color:var(--navy-deep);
  }
  .brand-text p{
    margin:2px 0 0;font-size:12.5px;letter-spacing:0.4px;text-transform:uppercase;
    color:var(--teal-deep);font-weight:500;
  }
  .maintabs{display:flex;gap:6px;align-self:flex-end;}
  .maintab{
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;
    padding:9px 14px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--ink-soft);
    border:1px solid transparent;border-bottom:none;background:transparent;
    transition:background .15s, color .15s;
  }
  .maintab:hover{color:var(--navy);}
  .maintab.active{
    background:var(--paper);color:var(--navy-deep);border-color:var(--line-strong);
    position:relative;top:2px;font-weight:600;
  }

  /* Stepper */
  .stepper{display:flex;align-items:center;gap:0;margin-bottom:26px;}
  .step{display:flex;align-items:center;gap:9px;color:var(--ink-soft);cursor:default;}
  .step.clickable{cursor:pointer;}
  .step-num{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
    font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);flex:none;background:var(--paper);
  }
  .step.active .step-num{background:var(--navy);border-color:var(--navy);color:#fff;}
  .step.done .step-num{background:var(--teal);border-color:var(--teal);color:#fff;}
  .step-label{font-size:13px;font-weight:500;}
  .step.active .step-label{color:var(--navy-deep);font-weight:600;}
  .step-sep{width:36px;height:1px;background:var(--line-strong);margin:0 10px;}

  /* Cards */
  .card{
    background:#FFFEFB;border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:24px;margin-bottom:18px;
  }
  .card h2{
    font-family:'Spectral',serif;font-size:19px;font-weight:600;margin:0 0 6px;color:var(--navy-deep);
  }
  .card .sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

  /* Dropzone */
  .dropzone{
    border:1.5px dashed var(--line-strong);border-radius:var(--radius);
    padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s;
    background:var(--paper-dim);
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--teal);background:#EFF6F4;}
  .dropzone svg{width:34px;height:34px;color:var(--teal-deep);margin-bottom:10px;}
  .dropzone .dz-title{font-weight:600;font-size:15px;color:var(--navy-deep);margin-bottom:4px;}
  .dropzone .dz-sub{font-size:12.5px;color:var(--ink-soft);}
  input[type=file]{display:none;}

  .filebar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:var(--paper-dim);border:1px solid var(--line);border-radius:6px;
    margin-top:14px;font-size:13.5px;
  }
  .filebar .fname{font-weight:600;color:var(--navy-deep);}
  .filebar .fmeta{color:var(--ink-soft);font-size:12px;font-family:'IBM Plex Mono',monospace;}

  /* Page thumbnails */
  .pagegrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:16px;
  }
  .pagethumb{
    border:2px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;background:#fff;
    transition:border-color .15s, transform .1s;position:relative;
  }
  .pagethumb:hover{border-color:var(--teal);}
  .pagethumb.selected{border-color:var(--navy);box-shadow:0 0 0 2px rgba(12,45,70,0.15);}
  .pagethumb img{display:block;width:100%;height:auto;}
  .pagethumb .plabel{
    position:absolute;bottom:0;left:0;right:0;background:rgba(12,45,70,0.82);color:#fff;
    font-size:10.5px;text-align:center;padding:3px 0;font-family:'IBM Plex Mono',monospace;
  }
  .pagethumb.converted::after{
    content:"✓ converted";position:absolute;top:5px;right:5px;background:var(--teal);color:#fff;
    font-size:9px;padding:2px 6px;border-radius:9px;font-weight:600;letter-spacing:.3px;
  }

  /* Buttons */
  .btn{
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:600;padding:10px 18px;
    border-radius:5px;border:1.5px solid var(--navy);cursor:pointer;transition:opacity .15s, transform .05s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--navy-deep);}
  .btn-ghost{background:transparent;color:var(--navy);}
  .btn-ghost:hover:not(:disabled){background:rgba(12,45,70,0.06);}
  .btn-teal{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn-teal:hover:not(:disabled){background:var(--teal-deep);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn svg{width:14px;height:14px;flex:none;}
  .actionrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center;}

  textarea.mdbox{
    width:100%;min-height:360px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;
    border:1px solid var(--line);border-radius:6px;padding:16px;background:#FCFBF8;color:var(--ink);
    resize:vertical;
  }
  textarea.mdbox:focus{outline:none;border-color:var(--teal);}

  .empty{
    text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:13.5px;
  }
  .empty svg{width:30px;height:30px;color:var(--line-strong);margin-bottom:10px;}

  .spinner{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite;flex:none;
  }
  .spinner.dark{border:2px solid rgba(12,45,70,.25);border-top-color:var(--navy);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Checklist settings */
  .catgroup{margin-bottom:20px;}
  .catgroup h3{
    font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal-deep);
    font-weight:600;margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;
  }
  .ruleitem{
    display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--paper-dim);
  }
  .ruleitem:last-child{border-bottom:none;}
  .ruletoggle{
    width:36px;height:20px;border-radius:10px;background:var(--line-strong);position:relative;
    cursor:pointer;flex:none;margin-top:2px;transition:background .15s;
  }
  .ruletoggle.on{background:var(--teal);}
  .ruletoggle .knob{
    width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;
    transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .ruletoggle.on .knob{left:18px;}
  .ruletext{flex:1;}
  .ruletext textarea{
    width:100%;border:1px solid transparent;background:transparent;font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;color:var(--ink);resize:none;padding:2px 4px;line-height:1.5;border-radius:4px;
  }
  .ruletext textarea:focus{outline:none;border-color:var(--line-strong);background:#fff;}
  .ruletext .rulecat-select{
    font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);border:none;background:transparent;
    margin-top:2px;cursor:pointer;
  }
  .ruledel{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;flex:none;border-radius:4px;
  }
  .ruledel:hover{color:var(--coral);background:rgba(200,90,62,0.08);}
  .ruledel svg{width:15px;height:15px;}
  .addrule{
    display:flex;gap:10px;margin-top:16px;
  }
  .addrule input{
    flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:5px;font-size:13.5px;font-family:inherit;
  }
  .addrule input:focus{outline:none;border-color:var(--teal);}
  select.newcat{
    padding:9px 10px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;font-family:inherit;background:#fff;
  }

  /* Results / stamps */
  .resultsummary{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .sumchip{
    display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:20px;font-size:12.5px;font-weight:600;
    border:1.5px solid var(--line);background:var(--paper-dim);
  }
  .sumchip .dot{width:8px;height:8px;border-radius:50%;}
  .resultcard{
    display:flex;gap:16px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;background:#FFFEFB;align-items:flex-start;
  }
  .stamp{
    flex:none;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:2.5px dashed currentColor;transform:rotate(-8deg);position:relative;
  }
  .stamp .stamp-inner{
    width:52px;height:52px;border-radius:50%;border:1px solid currentColor;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;
  }
  .stamp svg{width:20px;height:20px;}
  .stamp .stamp-word{font-size:7px;font-weight:700;letter-spacing:.5px;font-family:'IBM Plex Mono',monospace;margin-top:1px;}
  .stamp.pass{color:var(--success);}
  .stamp.fail{color:var(--coral);}
  .stamp.warning{color:var(--amber);}
  .stamp.unclear{color:var(--ink-soft);}
  .resultbody{flex:1;min-width:0;}
  .resultbody .rcat{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--teal-deep);font-weight:600;
  }
  .resultbody .rrule{font-weight:600;font-size:14.5px;color:var(--navy-deep);margin:3px 0 6px;line-height:1.4;}
  .resultbody .rfinding{font-size:13.5px;color:var(--ink);line-height:1.55;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px;}
  .toolbar .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .filterbtn{
    font-size:12px;padding:6px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;
    cursor:pointer;color:var(--ink-soft);font-weight:500;
  }
  .filterbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .errbox{
    background:#FBEEE9;border:1px solid rgba(200,90,62,0.35);color:#8A3B23;padding:12px 14px;border-radius:6px;
    font-size:13px;margin-top:14px;
  }

  @media (max-width:640px){
    .stepper{flex-wrap:wrap;}
    .step-sep{width:16px;margin:0 4px;}
    .step-label{display:none;}
    .step.active .step-label{display:inline;}
    .resultcard{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" stroke="#0C2D46" stroke-width="2"/>
        <path d="M8 26c4-6 8-6 12 0s8 6 12 0 8-6 8 0" stroke="#2A8C82" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M8 32c4-6 8-6 12 0s8 6 12 0 8-6 8 0" stroke="#0C2D46" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.55"/>
      </svg>
      <div class="brand-text">
        <h1>AquaCheck</h1>
        <p>Feed Document Inspection</p>
      </div>
    </div>
    <div class="maintabs">
      <div class="maintab" id="tab-document">Document</div>
      <div class="maintab" id="tab-checklist">Checklist Settings</div>
    </div>
  </div>

  <div id="view-document"></div>
  <div id="view-checklist" style="display:none;"></div>

</div>

<script>
/* ---------------- Icons ---------------- */
const ICONS = {
  upload: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 18v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>`,
  file: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="M6 12l6 6 6-6"/><path d="M4 20h16"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>`,
  alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.86L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.86a2 2 0 0 0-3.4 0z"/></svg>`,
  question: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>`,
  stamp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="14" width="12" height="6" rx="1"/><path d="M9 14v-3a3 3 0 0 1 6 0v3"/><path d="M4 20h16"/></svg>`,
  clipboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="1.5"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 11h6"/><path d="M9 15h6"/></svg>`,
};

/* ---------------- Default checklist ---------------- */
const DEFAULT_RULES = [
  {id:'r1', category:'Completeness', enabled:true, rule:'Consignor, consignee, and manufacturer details are all stated in full (name and address).'},
  {id:'r2', category:'Completeness', enabled:true, rule:'Country of origin, place/port of dispatch, and destination port are all stated.'},
  {id:'r3', category:'Completeness', enabled:true, rule:'Species of raw material are named for every batch listed — none are left blank.'},
  {id:'r4', category:'Regulatory Requirements', enabled:true, rule:'The heat-treatment statement specifies at least 85°C for at least 15 minutes, or an officially recognized equivalent method.'},
  {id:'r5', category:'Regulatory Requirements', enabled:true, rule:'Microbiological limits are declared for Salmonella (absence in 25 g) and Enterobacteriaceae, with n / c / m / M values defined.'},
  {id:'r6', category:'Regulatory Requirements', enabled:true, rule:'The certificate confirms the product is free of ruminant-derived ingredients, verified by PCR or an equivalent method.'},
  {id:'r7', category:'Data Consistency', enabled:true, rule:'Each batch\u2019s date of manufacture falls before the certificate\u2019s date of issue.'},
  {id:'r8', category:'Data Consistency', enabled:true, rule:'Batch numbers on any attached sheet match the batch numbers referenced on the main certificate.'},
  {id:'r9', category:'Data Consistency', enabled:false, rule:'The total package count and net weight stated match the sum of the individual line items.'},
  {id:'r10', category:'Formalities', enabled:true, rule:'The certificate is signed and bears the official stamp of an authorized veterinary official.'},
];
const CATEGORIES = ['Completeness','Regulatory Requirements','Data Consistency','Formalities'];

/* ---------------- State ---------------- */
const State = {
  mainTab: 'document',
  docStep: 'upload', // upload | preview | results
  fileName: null,
  fileKind: null, // 'pdf' | 'md'
  pdfDoc: null,
  pages: [], // {num, dataUrl, converted}
  selectedPage: null,
  converting: false,
  markdown: '',
  checklist: null,
  checking: false,
  checkError: null,
  results: null, // array
  resultFilter: 'all',
};

/* ---------------- Storage ---------------- */
async function loadChecklist(){
  try{
    const res = await window.storage.get('checklist-items', false);
    if(res && res.value){
      State.checklist = JSON.parse(res.value);
      return;
    }
  }catch(e){ /* not found */ }
  State.checklist = JSON.parse(JSON.stringify(DEFAULT_RULES));
  await saveChecklist();
}
async function saveChecklist(){
  try{
    await window.storage.set('checklist-items', JSON.stringify(State.checklist), false);
  }catch(e){ console.error('save failed', e); }
}

/* ---------------- Claude API helpers ---------------- */
async function callClaude(messages, {maxTokens=1500} = {}){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens,
      messages,
    })
  });
  if(!response.ok){
    throw new Error('API request failed: ' + response.status);
  }
  const data = await response.json();
  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
  return textBlocks.join('\n');
}

async function convertImageToMarkdown(base64Jpeg){
  const messages = [{
    role: "user",
    content: [
      {type: "image", source: {type: "base64", media_type: "image/jpeg", data: base64Jpeg}},
      {type: "text", text: "Convert this scanned document page into clean, accurate markdown. Preserve tables using markdown table syntax. Transcribe all visible text exactly, including any bilingual text. Do not summarize, omit, or add commentary — return only the markdown transcription of the page."}
    ]
  }];
  return await callClaude(messages, {maxTokens: 2000});
}

async function runChecklistCheck(markdown, rules){
  const ruleList = rules.map(r => `- id: ${r.id}\n  rule: ${r.rule}`).join('\n');
  const prompt = `You are a compliance reviewer for aquaculture feed export documents (health certificates, technical documents, and related paperwork).

Below is a document transcribed to markdown, followed by a checklist of rules. Evaluate the document against EVERY rule.

For each rule, respond with a status:
- "pass": the document clearly satisfies the rule
- "fail": the document clearly violates the rule or is missing required information the rule needs
- "warning": something looks off or worth a second look, but it isn't a clear failure
- "unclear": the document doesn't contain enough information to judge this rule

Respond with ONLY a JSON array, no markdown code fences, no preamble. Each element: {"id": "<rule id>", "status": "pass|fail|warning|unclear", "finding": "<one or two sentence plain-English explanation, citing specifics from the document where relevant>"}.

CHECKLIST:
${ruleList}

DOCUMENT (markdown):
"""
${markdown}
"""`;
  const messages = [{role: "user", content: prompt}];
  const raw = await callClaude(messages, {maxTokens: 2500});
  const cleaned = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(cleaned);
}

/* ---------------- Rendering: Document view ---------------- */
function renderDocumentView(){
  const el = document.getElementById('view-document');
  el.innerHTML = `
    ${renderStepper()}
    ${State.docStep === 'upload' ? renderUploadStep() : ''}
    ${State.docStep === 'preview' ? renderPreviewStep() : ''}
    ${State.docStep === 'results' ? renderResultsStep() : ''}
  `;
  wireDocumentEvents();
}

function renderStepper(){
  const steps = [
    {key:'upload', label:'Upload & Convert'},
    {key:'preview', label:'Preview Markdown'},
    {key:'results', label:'Check Results'},
  ];
  const order = ['upload','preview','results'];
  const curIdx = order.indexOf(State.docStep);
  return `<div class="stepper">
    ${steps.map((s,i)=>{
      const idx = order.indexOf(s.key);
      const cls = idx===curIdx ? 'active' : (idx<curIdx ? 'done clickable' : '');
      const clickable = idx <= curIdx || (s.key==='preview' && State.markdown) || (s.key==='results' && State.results);
      return `<div class="step ${cls} ${clickable?'clickable':''}" data-step="${s.key}">
        <div class="step-num">${idx<curIdx?'✓':(i+1)}</div>
        <div class="step-label">${s.label}</div>
      </div>${i<steps.length-1?'<div class="step-sep"></div>':''}`;
    }).join('')}
  </div>`;
}

function renderUploadStep(){
  return `
  <div class="card">
    <h2>Upload a document</h2>
    <p class="sub">Upload a PDF certificate, invoice, or technical document — or upload a markdown file directly if you already have one transcribed.</p>
    <div class="dropzone" id="dropzone">
      ${ICONS.upload}
      <div class="dz-title">Drop a file here, or click to browse</div>
      <div class="dz-sub">Accepts .pdf or .md</div>
    </div>
    <input type="file" id="fileinput" accept=".pdf,.md,text/markdown,application/pdf" />
    ${State.fileName ? `
      <div class="filebar">
        <div>${ICONS.file} <span class="fname">${escapeHtml(State.fileName)}</span></div>
        <div class="fmeta">${State.fileKind === 'pdf' ? (State.pages.length + ' page' + (State.pages.length===1?'':'s')) : 'markdown'}</div>
      </div>
    ` : ''}
    ${State.fileKind === 'pdf' && State.pages.length ? `
      <p class="sub" style="margin-top:18px;margin-bottom:8px;">Select a page to convert to markdown. You can convert additional pages afterward — each is appended to your document.</p>
      <div class="pagegrid" id="pagegrid">
        ${State.pages.map(p => `
          <div class="pagethumb ${State.selectedPage===p.num?'selected':''} ${p.converted?'converted':''}" data-page="${p.num}">
            <img src="${p.dataUrl}" />
            <div class="plabel">Page ${p.num}</div>
          </div>
        `).join('')}
      </div>
      <div class="actionrow">
        <button class="btn btn-primary" id="btn-convert" ${State.selectedPage==null || State.converting ? 'disabled':''}>
          ${State.converting ? '<span class="spinner"></span> Converting…' : ICONS.stamp + ' Convert page to markdown'}
        </button>
        ${State.markdown ? `<button class="btn btn-ghost" id="btn-goto-preview">${ICONS.check} Continue to preview</button>` : ''}
      </div>
    ` : ''}
    ${State.convertError ? `<div class="errbox">${escapeHtml(State.convertError)}</div>` : ''}
  </div>`;
}

function renderPreviewStep(){
  return `
  <div class="card">
    <h2>Preview &amp; edit</h2>
    <p class="sub">Review the converted markdown below. Fix any transcription errors before checking — the review only sees what's here.</p>
    <textarea class="mdbox" id="mdedit" placeholder="Paste or edit markdown here…">${escapeHtml(State.markdown)}</textarea>
    <div class="actionrow">
      <button class="btn btn-ghost" id="btn-download-md" ${State.markdown?'':'disabled'}>${ICONS.download} Download .md</button>
      <button class="btn btn-primary" id="btn-run-check" ${State.markdown.trim() ? '' : 'disabled'}>
        ${State.checking ? '<span class="spinner"></span> Checking…' : ICONS.clipboard + ' Check document'}
      </button>
    </div>
    ${State.checkError ? `<div class="errbox">${escapeHtml(State.checkError)}</div>` : ''}
  </div>`;
}

function stampFor(status){
  const map = {
    pass: {icon: ICONS.check, word:'PASS'},
    fail: {icon: ICONS.x, word:'FAIL'},
    warning: {icon: ICONS.alert, word:'REVIEW'},
    unclear: {icon: ICONS.question, word:'UNCLEAR'},
  };
  const m = map[status] || map.unclear;
  return `<div class="stamp ${status}"><div class="stamp-inner">${m.icon}<div class="stamp-word">${m.word}</div></div></div>`;
}

function renderResultsStep(){
  if(!State.results){
    return `<div class="card"><div class="empty">${ICONS.clipboard}<div>No results yet — run a check from the preview step.</div></div></div>`;
  }
  const rules = State.checklist;
  const byId = Object.fromEntries(rules.map(r=>[r.id,r]));
  const counts = {pass:0, fail:0, warning:0, unclear:0};
  State.results.forEach(r => { if(counts[r.status]!==undefined) counts[r.status]++; });

  const filtered = State.resultFilter==='all' ? State.results : State.results.filter(r=>r.status===State.resultFilter);

  return `
  <div class="card">
    <h2>Inspection results</h2>
    <p class="sub">Checked against ${rules.filter(r=>r.enabled).length} active checklist rule${rules.filter(r=>r.enabled).length===1?'':'s'}.</p>
    <div class="resultsummary">
      <div class="sumchip"><span class="dot" style="background:var(--success)"></span>${counts.pass} pass</div>
      <div class="sumchip"><span class="dot" style="background:var(--coral)"></span>${counts.fail} fail</div>
      <div class="sumchip"><span class="dot" style="background:var(--amber)"></span>${counts.warning} review</div>
      <div class="sumchip"><span class="dot" style="background:var(--ink-soft)"></span>${counts.unclear} unclear</div>
    </div>
    <div class="toolbar">
      <div class="filters">
        ${['all','fail','warning','unclear','pass'].map(f=>`<button class="filterbtn ${State.resultFilter===f?'active':''}" data-filter="${f}">${f==='all'?'All':f[0].toUpperCase()+f.slice(1)}</button>`).join('')}
      </div>
      <button class="btn btn-ghost btn-sm" id="btn-recheck">${ICONS.stamp} Re-check</button>
    </div>
    ${filtered.map(r => {
      const rule = byId[r.id];
      if(!rule) return '';
      return `<div class="resultcard">
        ${stampFor(r.status)}
        <div class="resultbody">
          <div class="rcat">${escapeHtml(rule.category)}</div>
          <div class="rrule">${escapeHtml(rule.rule)}</div>
          <div class="rfinding">${escapeHtml(r.finding || '')}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------------- Rendering: Checklist settings view ---------------- */
function renderChecklistView(){
  const el = document.getElementById('view-checklist');
  if(!State.checklist){ el.innerHTML = `<div class="card"><div class="empty">Loading checklist…</div></div>`; return; }
  const grouped = {};
  CATEGORIES.forEach(c => grouped[c] = []);
  State.checklist.forEach(r => { if(!grouped[r.category]) grouped[r.category]=[]; grouped[r.category].push(r); });

  el.innerHTML = `
  <div class="card">
    <h2>Checklist configuration</h2>
    <p class="sub">Manage the rules used to inspect aqua feed documents. Toggle a rule off to exclude it from checks, edit the wording inline, or add your own.</p>
    ${Object.keys(grouped).filter(c=>grouped[c].length).map(cat => `
      <div class="catgroup">
        <h3>${escapeHtml(cat)}</h3>
        ${grouped[cat].map(r => `
          <div class="ruleitem" data-id="${r.id}">
            <div class="ruletoggle ${r.enabled?'on':''}" data-toggle="${r.id}"><div class="knob"></div></div>
            <div class="ruletext">
              <textarea rows="2" data-edit="${r.id}">${escapeHtml(r.rule)}</textarea>
              <select class="rulecat-select" data-cat="${r.id}">
                ${CATEGORIES.map(c=>`<option value="${c}" ${c===r.category?'selected':''}>${c}</option>`).join('')}
              </select>
            </div>
            <button class="ruledel" data-del="${r.id}" title="Remove rule">${ICONS.trash}</button>
          </div>
        `).join('')}
      </div>
    `).join('')}
    <div class="addrule">
      <select class="newcat" id="newrule-cat">${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <input type="text" id="newrule-text" placeholder="Add a new checklist rule…" />
      <button class="btn btn-teal btn-sm" id="btn-add-rule">${ICONS.plus} Add</button>
    </div>
  </div>`;
  wireChecklistEvents();
}

/* ---------------- Event wiring ---------------- */
function wireMainTabs(){
  document.getElementById('tab-document').addEventListener('click', ()=>{
    State.mainTab='document'; renderApp();
  });
  document.getElementById('tab-checklist').addEventListener('click', ()=>{
    State.mainTab='checklist'; renderApp();
  });
}

function wireDocumentEvents(){
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileinput');
  if(dz){
    dz.addEventListener('click', ()=> fi.click());
    dz.addEventListener('dragover', e=>{e.preventDefault(); dz.classList.add('drag');});
    dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.classList.remove('drag');
      if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
  }
  if(fi) fi.addEventListener('change', e=>{ if(e.target.files.length) handleFile(e.target.files[0]); });

  document.querySelectorAll('.pagethumb').forEach(el=>{
    el.addEventListener('click', ()=>{
      State.selectedPage = parseInt(el.dataset.page,10);
      renderDocumentView();
    });
  });

  const convertBtn = document.getElementById('btn-convert');
  if(convertBtn) convertBtn.addEventListener('click', doConvertSelectedPage);

  const gotoPreview = document.getElementById('btn-goto-preview');
  if(gotoPreview) gotoPreview.addEventListener('click', ()=>{ State.docStep='preview'; renderDocumentView(); });

  document.querySelectorAll('.step.clickable').forEach(el=>{
    el.addEventListener('click', ()=>{ State.docStep = el.dataset.step; renderDocumentView(); });
  });

  const mdedit = document.getElementById('mdedit');
  if(mdedit) mdedit.addEventListener('input', e=>{ State.markdown = e.target.value; });

  const dlBtn = document.getElementById('btn-download-md');
  if(dlBtn) dlBtn.addEventListener('click', downloadMarkdown);

  const checkBtn = document.getElementById('btn-run-check');
  if(checkBtn) checkBtn.addEventListener('click', doRunCheck);

  const recheckBtn = document.getElementById('btn-recheck');
  if(recheckBtn) recheckBtn.addEventListener('click', doRunCheck);

  document.querySelectorAll('.filterbtn').forEach(el=>{
    el.addEventListener('click', ()=>{ State.resultFilter = el.dataset.filter; renderDocumentView(); });
  });
}

function wireChecklistEvents(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.toggle;
      const rule = State.checklist.find(r=>r.id===id);
      rule.enabled = !rule.enabled;
      await saveChecklist();
      renderChecklistView();
    });
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const id = el.dataset.edit;
      const rule = State.checklist.find(r=>r.id===id);
      rule.rule = el.value.trim();
      await saveChecklist();
    });
  });
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const id = el.dataset.cat;
      const rule = State.checklist.find(r=>r.id===id);
      rule.category = el.value;
      await saveChecklist();
      renderChecklistView();
    });
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.del;
      State.checklist = State.checklist.filter(r=>r.id!==id);
      await saveChecklist();
      renderChecklistView();
    });
  });
  const addBtn = document.getElementById('btn-add-rule');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const input = document.getElementById('newrule-text');
    const catSel = document.getElementById('newrule-cat');
    const text = input.value.trim();
    if(!text) return;
    State.checklist.push({id: 'r_' + Date.now(), category: catSel.value, enabled: true, rule: text});
    await saveChecklist();
    renderChecklistView();
  });
}

/* ---------------- Actions ---------------- */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function handleFile(file){
  State.convertError = null;
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  const isMd = file.name.toLowerCase().endsWith('.md') || file.type === 'text/markdown';

  if(isMd){
    const text = await file.text();
    State.fileName = file.name;
    State.fileKind = 'md';
    State.markdown = text;
    State.pages = [];
    State.selectedPage = null;
    State.docStep = 'preview';
    renderDocumentView();
    return;
  }

  if(isPdf){
    State.fileName = file.name;
    State.fileKind = 'pdf';
    State.markdown = '';
    State.pages = [];
    State.selectedPage = null;
    renderDocumentView();
    try{
      const buf = await file.arrayBuffer();
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({data: buf}).promise;
      State.pdfDoc = pdf;
      const pages = [];
      for(let i=1;i<=pdf.numPages;i++){
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({scale: 1.1});
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({canvasContext: ctx, viewport}).promise;
        pages.push({num: i, dataUrl: canvas.toDataURL('image/jpeg', 0.85), converted:false});
      }
      State.pages = pages;
      State.selectedPage = pages.length ? 1 : null;
    }catch(err){
      console.error(err);
      State.convertError = 'Could not read this PDF. Try a different file.';
    }
    renderDocumentView();
  }else{
    State.convertError = 'Please upload a .pdf or .md file.';
    renderDocumentView();
  }
}

async function doConvertSelectedPage(){
  const page = State.pages.find(p=>p.num===State.selectedPage);
  if(!page) return;
  State.converting = true; State.convertError = null;
  renderDocumentView();
  try{
    const base64 = page.dataUrl.split(',')[1];
    const md = await convertImageToMarkdown(base64);
    State.markdown = State.markdown ? (State.markdown.trim() + `\n\n---\n<!-- Page ${page.num} -->\n\n` + md.trim()) : md.trim();
    page.converted = true;
  }catch(err){
    console.error(err);
    State.convertError = 'Conversion failed. Please try again.';
  }
  State.converting = false;
  renderDocumentView();
}

function downloadMarkdown(){
  const blob = new Blob([State.markdown], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (State.fileName ? State.fileName.replace(/\.[^.]+$/,'') : 'document') + '.md';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function doRunCheck(){
  State.checking = true; State.checkError = null;
  renderDocumentView();
  try{
    const activeRules = State.checklist.filter(r=>r.enabled);
    if(activeRules.length===0){
      State.checkError = 'No checklist rules are enabled. Turn some on in Checklist Settings.';
      State.checking = false;
      renderDocumentView();
      return;
    }
    const results = await runChecklistCheck(State.markdown, activeRules);
    State.results = results;
    State.docStep = 'results';
    State.resultFilter = 'all';
  }catch(err){
    console.error(err);
    State.checkError = 'The check could not be completed. Please try again.';
  }
  State.checking = false;
  renderDocumentView();
}

/* ---------------- App root render ---------------- */
function renderApp(){
  document.getElementById('tab-document').classList.toggle('active', State.mainTab==='document');
  document.getElementById('tab-checklist').classList.toggle('active', State.mainTab==='checklist');
  document.getElementById('view-document').style.display = State.mainTab==='document' ? '' : 'none';
  document.getElementById('view-checklist').style.display = State.mainTab==='checklist' ? '' : 'none';
  renderDocumentView();
  renderChecklistView();
}

(async function init(){
  wireMainTabs();
  await loadChecklist();
  renderApp();
})();
</script>
