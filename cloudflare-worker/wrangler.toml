name = "aquacheck-proxy"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Set to your actual GitHub Pages origin (no trailing slash) once known.
# Using "*" works too but allows any site to call your proxy.
[vars]
ALLOWED_ORIGIN = "https://sonramsirirat.github.io"

# Secrets are NOT stored here — set them after creating the Worker:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put APP_KEY
#
# GEMINI_API_KEY: get a free key (no credit card required) at
#   https://aistudio.google.com/apikey
#
# APP_KEY: any passphrase you choose. This is the shared access key the
# AquaCheck frontend asks for before letting anyone use the app. Give it
# to whoever should have access. If you never set this secret, the gate
# is effectively disabled (any key, or no key, is accepted).